# Local development stack. Start it with `./vendor/bin/sail up -d`.
#
# Ollama is deliberately NOT a default service: on a machine with a GPU it runs much faster
# natively on the host, and the app reaches it through host.docker.internal. Machines without
# a GPU can run it in a container instead with `sail --profile ollama up -d` (see ADR-001).
services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.4/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
            - rustfs

    # Queue workers. Same image and code as the app, just running Horizon instead of a web server.
    # Dashboard: http://localhost/horizon
    horizon:
        image: sail-8.4/app
        command: ['php', 'artisan', 'horizon']
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - laravel.test
        restart: unless-stopped

    # Postgres with the pgvector extension baked in. Same database for CRM data and embeddings,
    # see ADR-002 for why we don't run a separate vector store.
    pgsql:
        image: 'pgvector/pgvector:pg18'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                [
                    'CMD',
                    'pg_isready',
                    '-q',
                    '-d',
                    '${DB_DATABASE}',
                    '-U',
                    '${DB_USERNAME}',
                ]
            retries: 3
            timeout: 5s

    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            retries: 3
            timeout: 5s

    # S3-compatible object storage for uploaded documents. Stands in for AWS S3 so the project
    # costs nothing to run (ADR-004). The web console is on http://localhost:9001.
    rustfs:
        image: 'rustfs/rustfs:latest'
        ports:
            - '${FORWARD_RUSTFS_PORT:-9000}:9000'
            - '${FORWARD_RUSTFS_CONSOLE_PORT:-9001}:9001'
        environment:
            RUSTFS_VOLUMES: '/data'
            RUSTFS_ADDRESS: '0.0.0.0:9000'
            RUSTFS_CONSOLE_ADDRESS: '0.0.0.0:9001'
            RUSTFS_CONSOLE_ENABLE: 'true'
            RUSTFS_EXTERNAL_ADDRESS: ':9000'
            RUSTFS_CORS_ALLOWED_ORIGINS: '*'
            RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: '*'
            RUSTFS_ACCESS_KEY: '${AWS_ACCESS_KEY_ID:-sail}'
            RUSTFS_SECRET_KEY: '${AWS_SECRET_ACCESS_KEY:-password}'
            RUSTFS_LOG_LEVEL: 'info'
        volumes:
            - 'sail-rustfs:/data'
        networks:
            - sail
        healthcheck:
            test:
                [
                    'CMD',
                    'sh',
                    '-c',
                    'curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/health',
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

    # Optional: CPU-only Ollama for reviewers without a GPU. Point OLLAMA_URL at http://ollama:11434.
    ollama:
        image: 'ollama/ollama:latest'
        profiles: ['ollama']
        ports:
            - '${FORWARD_OLLAMA_PORT:-11435}:11434'
        volumes:
            - 'sail-ollama:/root/.ollama'
        networks:
            - sail

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
    sail-rustfs:
        driver: local
    sail-ollama:
        driver: local
